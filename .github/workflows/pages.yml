# Publishes a preview of the site to GitHub Pages.
# The production site is still built locally and uploaded to Hostinger (see README).
#
# One-time setup in the repository on GitHub:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
name: Preview on GitHub Pages

on:
  push:
    branches:
      - main
      - claude/krevon-studio-website-r5jd31
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Project pages are served from /<repository-name>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optional: add this as a repository variable to make the form send.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
      # Second site: built from v2/ and published under /<repository-name>/v2/
      - run: npm ci
        working-directory: v2
      - run: npm run lint
        working-directory: v2
      - run: npm run build
        working-directory: v2
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/v2
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
      - run: cp -r v2/out out/v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
